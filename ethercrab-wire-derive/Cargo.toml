[package]
name = "ethercrab-wire-derive"
version = "0.3.0"
edition = "2021"
categories = ["science::robotics", "no-std", "network-programming"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ethercrab-rs/ethercrab"
documentation = "https://docs.rs/ethercrab-derive"
description = "Derive macros for EtherCrab"
resolver = "2"
keywords = ["ethercat", "ethercrab", "beckhoff", "automation", "fieldbus"]
rust-version = "1.79"

[lib]
proc-macro = true
# Explicitly written here to make cargo-readme happy <https://github.com/webern/cargo-readme/issues/32>
path = "src/lib.rs"

[dependencies]
proc-macro2 = { version = "1.0.73", default-features = false }
quote = { version = "1.0.34", default-features = false }
syn = { version = "2.0.44", default-features = false, features = ["full"] }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
trybuild = { version = "1.0.86", default-features = false }
ethercrab-wire = { path = "../ethercrab-wire", default-features = false }
syn = { version = "2.0.44", default-features = false, features = [
    "full",
    "extra-traits",
] }
pretty_assertions = { version = "1.4.1", default-features = false,features = [
    "std",
]  }

[[bench]]
name = "derive-struct"
harness = false

[[bench]]
name = "derive-enum"
harness = false

[[bench]]
name = "derive-large"
harness = false
