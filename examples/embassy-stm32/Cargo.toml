[package]
name = "ethercrab-stm32-embassy"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
ethercrab = { path = "../..", default-features = false, features = ["defmt"] }

defmt = "1.2.0"
defmt-rtt = "1.3.1"
cortex-m = { version = "0.7.10", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.7"
embedded-hal = "1.0.0"
embedded-io = "0.7.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = { version = "2.1.1" }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-1_000_000",
] }
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "stm32f429zi",
    "memory-x",
    "time-driver-any",
] }
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "tcp",
    "dhcpv4",
    "medium-ethernet",
] }
embassy-net-driver = { version = "0.2.0", features = ["defmt"] }

[profile.release]
debug = 2
opt-level = "z"
lto = true
codegen-units = 1
