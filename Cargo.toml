[package]
name = "ethercrab"
categories = ["science::robotics", "no-std", "network-programming"]
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ethercrab-rs/ethercrab"
documentation = "https://docs.rs/ethercrab"
description = "A pure Rust EtherCAT MainDevice supporting std and no_std environments"
keywords = ["ethercat", "beckhoff", "automation", "fieldbus", "robotics"]
exclude = ["dumps", "doc", "NOTES.md", "SPECNOTES.md"]
resolver = "2"
rust-version = "1.100"

[workspace]
members = ["ethercrab-wire", "ethercrab-wire-derive"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]

[dependencies]
async-io = { version = "2.0.0", optional = true }
atomic-waker = { version = "1.1.2", default-features = false }
atomic_enum = { version = "0.3.0", default-features = false, features = [
    "cas",
] }
bitflags = { version = "2.13.2", default-features = false }
defmt = { version = "1.2.0", optional = true }
embedded-io-async = { version = "0.7.0", default-features = false }
futures-lite = { version = "2.0.0", default-features = false }
heapless = { version = "0.9.4", default-features = false }
log = { version = "0.4.27", optional = true, default-features = false }
sealed = { version = "0.7.0", default-features = false }
serde = { version = "1.0.190", features = ["derive"], optional = true }
ethercrab-wire = { version = "0.3.0", path = "./ethercrab-wire", default-features = false }
spin = { version = "0.12.3", default-features = false, features = [
    "lock_api",
    "rwlock",
] }
crc = { version = "3.2.1", default-features = false }
lock_api = { version = "0.4.14", default-features = false }
embassy-time = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
pnet_datalink = { version = "0.35.0", default-features = false, features = [
    "std",
], optional = true }
pcap = { version = "2.2.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.180", default-features = false }
nix = { version = "0.32.0", features = ["net"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7.4", default-features = false, optional = true }
smallvec = { version = "1.13.1", default-features = false, features = [
    "const_generics",
] }
slab = { version = "0.4.12", default-features = false }
xsk-rs = { version = "0.11.0", default-features = false, optional = true }

[dev-dependencies]
arbitrary = { version = "1.3.1", default-features = false, features = [
    "derive",
] }
# Can't use 0.8.0 or any version with `alloca` in dep tree because it doesn't build on musl libc
criterion = { version = "0.7.0", default-features = false, features = [
    "cargo_bench_support",
] }
env_logger = { version = "0.11.6", default-features = false }
heckcheck = { version = "2.0.1", default-features = false }
pcap-file = { version = "3.0.0", default-features = false }
pretty_assertions = { version = "1.4.0", default-features = false, features = [
    "std",
] }
smol = { version = "2.0.0", default-features = false }
tokio = { version = "1.33.0", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
thread-priority = { version = "3.1.1", default-features = false }
ta = { version = "0.5.0", default-features = false }
cassette = { version = "0.3.0", default-features = false }
csv = { version = "1.3.0", default-features = false }
serde = { version = "1.0.190", default-features = false, features = ["derive"] }
signal-hook = { version = "0.4.6", default-features = false }
core_affinity = { version = "0.8.1", default-features = false }
spin_sleep = { version = "1.2.1", default-features = false }
quanta = { version = "0.13.0", default-features = false }
savefile = { version = "0.20.6", default-features = false }
savefile-derive = { version = "0.20.6", default-features = false }
simple_logger = { version = "5.0.0", default-features = false }
smoltcp = { version = "0.14.0", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-raw",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
timerfd = { version = "1.5.0", default-features = false }

[features]
default = ["std", "io-uring"]
defmt = [
    "dep:defmt",
    "embedded-io-async/defmt",
    "heapless/defmt",
    "ethercrab-wire/defmt",
]
log = ["dep:log"]
std = [
    "dep:pnet_datalink",
    "dep:async-io",
    "log",
    "futures-lite/std",
    "embedded-io-async/std",
    "ethercrab-wire/std",
    "spin/std",
]
xdp = ["dep:xsk-rs"]
serde = ["dep:serde", "bitflags/serde"]
io-uring = ["dep:io-uring"]
# [[example]]
# name = "akd"
# required-features = ["std"]

[[example]]
name = "xdp"
required-features = ["std", "xdp"]

[[example]]
name = "dc"
required-features = ["std"]

# [[example]]
# name = "ec400"
# required-features = ["std"]

[[example]]
name = "ek1100"
required-features = ["std"]

[[example]]
name = "ek1100-windows"
required-features = ["std"]

[[example]]
name = "multiple-groups"
required-features = ["std"]

[[example]]
name = "io-uring"
required-features = ["std", "io-uring"]

[[example]]
name = "smol-io-uring"
required-features = ["std", "io-uring"]

[[bench]]
name = "pdu_loop"
harness = false

[[bench]]
name = "frame"
harness = false

[profile.profiling]
inherits = "release"
debug = true
