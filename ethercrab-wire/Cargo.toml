[package]
name = "ethercrab-wire"
version = "0.3.0"
edition = "2021"
categories = ["science::robotics", "no-std", "network-programming"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ethercrab-rs/ethercrab"
documentation = "https://docs.rs/ethercrab-wire"
description = "On-the-wire tools for the EtherCrab crate"
keywords = ["ethercat", "ethercrab", "beckhoff", "automation", "fieldbus"]
resolver = "2"
rust-version = "1.79"

[dependencies]
defmt = { version = "1.2.0", optional = true, default-features = false }
ethercrab-wire-derive = { version = "0.3.0", path = "../ethercrab-wire-derive", default-features = false }
heapless = { version = "0.9.4", default-features = false }

[features]
std = []
defmt = ["dep:defmt", "heapless/defmt"]
